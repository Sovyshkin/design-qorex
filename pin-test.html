<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест PIN кода</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Тест новой логики PIN кода</h1>

    <div class="test-section">
        <h3>Тест функций PIN кода</h3>
        <button onclick="testPinFunctions()">Запустить тесты</button>
        <div id="test-results"></div>
    </div>

    <div class="test-section">
        <h3>Симуляция работы с PIN</h3>
        <input type="text" id="pin-input" placeholder="Введите PIN" maxlength="4">
        <button onclick="simulateSetPin()">Установить PIN</button>
        <button onclick="simulateVerifyPin()">Проверить PIN</button>
        <button onclick="simulateDisablePin()">Отключить PIN</button>
        <div id="simulation-results"></div>
    </div>

    <script type="module">
        // Имитируем работу store для тестирования
        class MockWalletStore {
            constructor() {
                this.pinCode = '';
                this.codePasswordActive = false;
                this.pinVerified = false;
                this.pinVerificationTime = 0;
            }

            setPinCode(pin) {
                this.pinCode = pin;
                this.codePasswordActive = true;
                this.pinVerified = true;
                this.pinVerificationTime = Date.now();
                console.log('PIN установлен:', pin);
                return true;
            }

            verifyPin(enteredPin) {
                if (!this.codePasswordActive) {
                    console.log('PIN не активен');
                    return false;
                }

                if (!this.pinCode) {
                    console.warn('PIN не загружен');
                    return false;
                }

                const isValid = String(enteredPin) === String(this.pinCode);
                if (isValid) {
                    this.pinVerified = true;
                    this.pinVerificationTime = Date.now();
                }
                return isValid;
            }

            isPinRequired() {
                if (!this.codePasswordActive) {
                    return false;
                }

                if (!this.pinVerified) {
                    return true;
                }

                const sessionTimeout = 5 * 60 * 1000;
                if (Date.now() - this.pinVerificationTime > sessionTimeout) {
                    this.pinVerified = false;
                    return true;
                }

                return false;
            }

            hasPinCode() {
                return this.codePasswordActive && !!this.pinCode;
            }

            disablePinCode() {
                this.pinCode = '';
                this.codePasswordActive = false;
                this.pinVerified = false;
                this.pinVerificationTime = 0;
                console.log('PIN отключен');
                return true;
            }
        }

        const store = new MockWalletStore();

        window.testPinFunctions = function() {
            const results = document.getElementById('test-results');
            results.innerHTML = '';

            // Тест 1: Изначально PIN не требуется
            let test1 = !store.isPinRequired();
            results.innerHTML += `<div class="${test1 ? 'success' : 'error'}">Тест 1 - PIN не требуется изначально: ${test1 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 2: Установка PIN
            let test2 = store.setPinCode('1234');
            results.innerHTML += `<div class="${test2 ? 'success' : 'error'}">Тест 2 - Установка PIN: ${test2 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 3: PIN теперь требуется
            let test3 = store.isPinRequired();
            results.innerHTML += `<div class="${!test3 ? 'success' : 'error'}">Тест 3 - PIN не требуется после установки: ${!test3 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 4: Проверка правильного PIN
            let test4 = store.verifyPin('1234');
            results.innerHTML += `<div class="${test4 ? 'success' : 'error'}">Тест 4 - Проверка правильного PIN: ${test4 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 5: Проверка неправильного PIN
            let test5 = !store.verifyPin('9999');
            results.innerHTML += `<div class="${test5 ? 'success' : 'error'}">Тест 5 - Проверка неправильного PIN: ${test5 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 6: Отключение PIN
            let test6 = store.disablePinCode();
            results.innerHTML += `<div class="${test6 ? 'success' : 'error'}">Тест 6 - Отключение PIN: ${test6 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;

            // Тест 7: PIN снова не требуется
            let test7 = !store.isPinRequired();
            results.innerHTML += `<div class="${test7 ? 'success' : 'error'}">Тест 7 - PIN не требуется после отключения: ${test7 ? 'ПРОЙДЕН' : 'ПРОВАЛЕН'}</div>`;
        };

        window.simulateSetPin = function() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length === 4) {
                store.setPinCode(pin);
                document.getElementById('simulation-results').innerHTML =
                    `<div class="success">PIN ${pin} установлен успешно</div>`;
            } else {
                document.getElementById('simulation-results').innerHTML =
                    `<div class="error">PIN должен быть 4 цифры</div>`;
            }
        };

        window.simulateVerifyPin = function() {
            const pin = document.getElementById('pin-input').value;
            const result = store.verifyPin(pin);
            document.getElementById('simulation-results').innerHTML =
                `<div class="${result ? 'success' : 'error'}">PIN ${result ? 'верный' : 'неверный'}</div>`;
        };

        window.simulateDisablePin = function() {
            store.disablePinCode();
            document.getElementById('simulation-results').innerHTML =
                `<div class="success">PIN отключен</div>`;
        };
    </script>
</body>
</html>
